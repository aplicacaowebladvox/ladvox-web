<header>
  <h1>Pacientes</h1>
  <p>Listagem de pacientes do sistema</p>
</header>
<section class="filters">
  <span class="title">Filtros</span>
  <form
    *ngIf="form"
    (keydown.enter)="$event.preventDefault()"
    (keyup.enter)="clickFilter()"
    [formGroup]="form"
  >
    <div class="form-control w-60">
      <label for="patientName">Nome</label>
      <input
        type="text"
        id="patientName"
        name="patientName"
        formControlName="name"
      />
    </div>
    <div class="form-control-group w-20">
      <label for="ageStarts">Idade entre</label>
      <div>
        <input
          type="number"
          id="ageStarts"
          name="ageStarts"
          formControlName="ageStarts"
          mask="0*"
        />
        <label for="ageEnds">e</label>
        <input
          type="number"
          id="ageEnds"
          name="ageEnds"
          formControlName="ageEnds"
          mask="0*"
        />
      </div>
    </div>
    <div class="form-control w-20">
      <label for="document">CPF</label>
      <input
        type="text"
        id="document"
        name="document"
        formControlName="document"
        mask="000.000.000-00"
      />
    </div>
  </form>
  <div class="actions">
    <button
      class="warn"
      (click)="clickClean()"
    >
      <i class="fa-solid fa-filter-circle-xmark"></i>
      Limpar
    </button>
    <button
      class="primary"
      (click)="clickFilter()"
    >
      <i class="fa-solid fa-filter"></i>
      Buscar
    </button>
  </div>
</section>
<section class="actions">
  <ng-container *hasPermission="'paciente.paciente.form.new'">
    <button
      class="success"
      (click)="clickAddNew()"
    >
      <i class="fa-solid fa-circle-plus"></i>
      Novo
    </button>
  </ng-container>
</section>
<section>
  <app-card-table [cardTableConfig]="cardTableModel">
    <app-action-card-table [config]="editCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="anamnesisCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="viewCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="protocolCardTableActionConfig"></app-action-card-table>
  </app-card-table>
</section>
