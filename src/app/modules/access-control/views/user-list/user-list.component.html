<header>
  <h1>Usuários</h1>
  <p>Listagem de usuários do sistema</p>
</header>
<section class="filters">
  <span class="title">Filtros</span>
  <form
    *ngIf="form"
    (keydown.enter)="$event.preventDefault()"
    [formGroup]="form"
  >
    <div class="form-control w-80">
      <label for="name">Nome</label>
      <input
        type="text"
        id="name"
        name="name"
        formControlName="name"
      />
    </div>
    <div class="form-control w-20">
      <label for="document">CPF</label>
      <input
        type="text"
        id="document"
        name="document"
        formControlName="document"
        mask="000.000.000-00"
      />
    </div>
    <div class="form-control w-100">
      <label for="roleIds">Papéis</label>
      <p-multiSelect
        [options]="rolesAvailablesSelectOptions"
        formControlName="roleIds"
        optionLabel="name"
        optionValue="id"
        display="chip"
        [showClear]="true"
      />
    </div>
  </form>
  <div class="actions">
    <button
      class="warn"
      (click)="clickClean()"
    >
      <i class="fa-solid fa-filter-circle-xmark"></i>
      Limpar
    </button>
    <button
      class="primary"
      (click)="clickFilter()"
    >
      <i class="fa-solid fa-filter"></i>
      Buscar
    </button>
  </div>
</section>
<section class="actions">
  <ng-container *hasPermission="'controle-acesso.usuarios.form.new'">
    <button
      class="success"
      (click)="clickAddNew()"
    >
      <i class="fa-solid fa-circle-plus"></i>
      Novo
    </button>
  </ng-container>
</section>
<section>
  <app-card-table [cardTableConfig]="cardTableModel">
    <app-action-card-table [config]="editCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="viewCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="removeCardTableActionConfig"></app-action-card-table>
  </app-card-table>
</section>
