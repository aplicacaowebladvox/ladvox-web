<app-loading [isLoading]="isLoading" />
<header>
  <h1>Contatos</h1>
</header>
<section
  class="forms"
  *ngIf="form"
>
  <form [formGroup]="form">
    <form
      *ngFor="let addressForm of form.getRawValue().addressesForms || []"
      [formGroup]="addressForm"
    >
      <fieldset class="form-control w-100">
        <legend>Endereço: {{ getAddressAsString(addressForm) || 'Novo' }}</legend>
        <form class="form">
          <div class="form-control w-20">
            <label for="country">País</label>
            <input
              type="text"
              name="country"
              id="country"
              formControlName="country"
            />
          </div>
          <div class="form-control w-20">
            <label for="zipCode">CEP</label>
            <input
              type="text"
              name="zipCode"
              id="zipCode"
              formControlName="zipCode"
              mask="00.000-000"
            />
          </div>
          <div class="form-control w-20">
            <label for="state">Estado</label>
            <input
              type="text"
              name="state"
              id="state"
              formControlName="state"
            />
          </div>
          <div class="form-control w-20">
            <label for="city">Cidade</label>
            <input
              type="text"
              name="city"
              id="city"
              formControlName="city"
            />
          </div>
          <div class="form-control w-20">
            <label for="neighborhood">Bairro</label>
            <input
              type="text"
              name="neighborhood"
              id="neighborhood"
              formControlName="neighborhood"
            />
          </div>
          <div class="form-control w-80">
            <label for="street">Rua</label>
            <input
              type="text"
              name="street"
              id="street"
              formControlName="street"
            />
          </div>
          <div class="form-control w-20">
            <label for="number">Número</label>
            <input
              type="text"
              name="number"
              id="number"
              placeholder="Sem Número"
              formControlName="number"
            />
          </div>
        </form>
      </fieldset>
    </form>
    <form
      *ngFor="let emailForm of form.getRawValue().emailsForms"
      [formGroup]="emailForm"
    >
      <fieldset class="form-control w-100">
        <legend>E-mail</legend>
        <div class="form-control w-100">
          <label for="emailAddress">E-mail</label>
          <input
            type="email"
            name="emailAddress"
            id="emailAddress"
            formControlName="emailAddress"
          />
        </div>
      </fieldset>
    </form>
    <form
      *ngFor="let phoneForm of form.getRawValue().phonesForms"
      [formGroup]="phoneForm"
    >
      <fieldset class="form-control w-100">
        <legend>Telefone</legend>
        <div class="form-control w-100">
          <label for="phone">Telefone</label>
          <input
            type="text"
            name="phone"
            id="phone"
            formControlName="phoneNumber"
            mask="0000-0000||00000-0000||(00) 0000-0000||(00) 00000-0000||+00 (00) 0000-0000||+000 (00) 00000-0000"
          />
        </div>
      </fieldset>
    </form>
  </form>
  <div class="actions">
    <button
      class="warn"
      style="margin-right: auto"
      (click)="clickBack()"
    >
      <i class="fa-solid fa-reply"></i>
      Voltar
    </button>
    <ng-container *hasPermission="'configuracao-sistema.contato.form.edit'">
      <button
        class="primary"
        *ngIf="canShow('buttonEdit')"
        (click)="clickEdit()"
      >
        <i class="fa-solid fa-pencil"></i>
        Editar
      </button>

      <button
        class="primary"
        *ngIf="canShow('buttonSave')"
        (click)="clickSave()"
      >
        <i class="fa-solid fa-floppy-disk"></i>
        Salvar
      </button>
    </ng-container>
  </div>
</section>
