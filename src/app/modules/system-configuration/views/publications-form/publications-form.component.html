<app-loading [isLoading]="isLoading" />
<header>
  <h1>Publicações</h1>
</header>
<section class="forms">
  <span class="title"> {{ id ? id + '' : 'Nova' }} - Publicação</span>
  <form
    *ngIf="form"
    [formGroup]="form"
  >
    <div class="form-control w-100">
      <label for="title">Título</label>
      <input
        type="text"
        id="title"
        formControlName="title"
      />
    </div>
    <div class="form-control w-100">
      <label for="bibliographicReference">Referência bibliográfica</label>
      <input
        type="text"
        id="status"
        formControlName="bibliographicReference"
      />
      <span
        class="info-selfend label"
        *ngIf="isLink(form.getRawValue().bibliographicReference)"
        >Apresentado como link</span
      >
    </div>
    <div class="form-control w-100">
      <div class="form-control w-100">
        <p-editor
          id="publicationAbstract"
          name="publicationAbstract"
          [style]="{ height: '160px' }"
          formControlName="publicationAbstract"
          [readonly]="form.disabled"
        />
      </div>
    </div>
  </form>
  <div class="actions">
    <button
      class="warn"
      style="margin-right: auto"
      (click)="clickBack()"
    >
      <i class="fa-solid fa-reply"></i>
      Voltar
    </button>
    <ng-container *hasPermission="'configuracao-sistema.projetos.delete'">
      <button
        class="secondary"
        *ngIf="!!id && editing"
        (click)="clickRemove()"
      >
        <i class="fa-solid fa-trash-can"></i>
        Remover
      </button>
    </ng-container>
    <ng-container *hasPermission="'configuracao-sistema.redes-sociais.form.edit'">
      <button
        class="primary"
        *ngIf="!!id && editing"
        (click)="clickSave()"
      >
        <i class="fa-solid fa-floppy-disk"></i>
        Salvar
      </button>
    </ng-container>
    <ng-container *hasPermission="'configuracao-sistema.redes-sociais.form.new'">
      <button
        class="primary"
        *ngIf="!id"
        (click)="clickCreate()"
      >
        <i class="fa-solid fa-circle-plus"></i>
        Criar
      </button>
    </ng-container>
  </div>
</section>
