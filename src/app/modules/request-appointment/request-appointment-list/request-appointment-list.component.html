<app-loading [isLoading]="isLoading" />
<header>
  <h1>Solicitações de consulta</h1>
  <p>Pedidos enviados pela Landing Page</p>
</header>
<section class="filters">
  <span class="title">Filtros</span>
  <form
    (keydown.enter)="$event.preventDefault()"
    (keyup.enter)="clickFilter()"
    [formGroup]="form"
  >
    <div class="form-control w-70">
      <label for="name">Nome</label>
      <input
        type="text"
        id="name"
        name="name"
        formControlName="name"
      />
    </div>
    <div class="form-control w-30">
      <label for="status">Situação</label>
      <p-dropdown
        inputId="status"
        [options]="statusAvailableSelectOptions"
        formControlName="status"
        optionLabel="name"
        optionValue="id"
        [showClear]="true"
        [filter]="true"
      />
    </div>
  </form>
  <div class="actions">
    <button
      class="warn"
      (click)="clickClean()"
    >
      <i class="fa-solid fa-filter-circle-xmark"></i>
      Limpar
    </button>
    <button
      class="primary"
      (click)="clickFilter()"
    >
      <i class="fa-solid fa-filter"></i>
      Buscar
    </button>
  </div>
</section>
<section>
  <app-card-table [cardTableConfig]="cardTableModel">
    <app-action-card-table [config]="concludeCardTableActionConfig"></app-action-card-table>
    <app-action-card-table [config]="viewCardTableActionConfig"></app-action-card-table>
  </app-card-table>
</section>
